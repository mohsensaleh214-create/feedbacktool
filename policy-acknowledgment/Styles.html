<style>
  /* ============================================================
     Shared design tokens — --accent* is Misk Schools' brand green,
     estimated from the logo (fine-tune the hex values below against
     Misk's brand guideline if you have exact codes). Nothing else in
     this file should need to change to re-skin the app further.
     ============================================================ */
  :root {
    --ink: #1c211f;
    --ink-soft: #55605a;
    --ink-faint: #8a938c;
    --paper: #faf9f6;
    --surface: #ffffff;
    --line: #d8e8e0;
    --line-soft: #eaf3ee;

    /* Misk Schools green, from the logo mark/wordmark. */
    --accent: #14966f;
    --accent-ink: #0b4a38;
    --accent-soft: #e2f3ec;

    --positive: #1f7a54;
    --positive-soft: #e4f3ea;
    --amber: #a9752f;
    --amber-soft: #f5ede0;
    --pending: #8a938c;
    --pending-soft: #eef2f0;

    --radius-lg: 16px;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(32, 31, 29, 0.05);
    --shadow-md: 0 6px 24px rgba(32, 31, 29, 0.08);
    --transition: 180ms ease;

    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }

  .app-shell { max-width: 880px; margin: 0 auto; padding: 0 20px 80px; }

  /* ===== Header ===== */
  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 0 20px; border-bottom: 2px solid var(--accent);
    margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand-logo { height: 52px; width: auto; display: block; }
  .brand-sub {
    color: var(--ink-faint); font-size: 0.86rem; padding-left: 16px;
    border-left: 1px solid var(--line);
  }
  @media (max-width: 480px) { .brand-logo { height: 40px; } .brand-sub { display: none; } }

  /* ===== Hero banner (dashboard only) ===== */
  .hero-banner {
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 24px;
    border: 2px solid var(--accent); box-shadow: var(--shadow-sm);
  }
  .hero-banner img { width: 100%; height: 190px; object-fit: cover; display: block; }
  @media (max-width: 520px) { .hero-banner img { height: 130px; } }
  .app-nav { display: flex; gap: 6px; }
  .nav-link {
    background: none; border: none; cursor: pointer; color: var(--ink-soft);
    font-size: 0.9rem; font-weight: 500; padding: 8px 14px; border-radius: 999px;
    transition: background var(--transition), color var(--transition);
  }
  .nav-link:hover { background: var(--line-soft); color: var(--ink); }

  /* ===== Generic layout ===== */
  .screen { animation: fade-in 220ms ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .page-head { margin-bottom: 28px; }
  .page-head h1 { font-family: var(--font-display); font-size: 1.9rem; font-weight: 600; margin: 0 0 6px; }
  .page-sub { color: var(--ink-faint); font-size: 0.95rem; margin: 0; }
  .page-head-narrow { max-width: 560px; margin: 0 auto 28px; text-align: left; }
  .page-head-narrow h1 { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; margin: 4px 0 0; }
  .eyebrow {
    display: block; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.72rem;
    font-weight: 600; color: var(--accent-ink);
  }
  .loading { color: var(--ink-faint); padding: 60px 0; text-align: center; font-size: 0.95rem; }

  /* ===== Dashboard ===== */
  .tier-block { margin-bottom: 32px; }
  .tier-title {
    font-family: var(--font-body); font-size: 0.82rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft); display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line-soft);
  }
  .tier-note { text-transform: none; font-weight: 400; letter-spacing: normal; color: var(--ink-faint); font-size: 0.82rem; }
  .policy-list { display: flex; flex-direction: column; gap: 8px; }
  .policy-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; cursor: pointer; transition: border-color var(--transition), box-shadow var(--transition);
  }
  .policy-row:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
  .policy-row-disabled { cursor: not-allowed; opacity: 0.6; }
  .policy-row-disabled:hover { border-color: var(--line); box-shadow: none; }
  .policy-name { font-weight: 600; font-size: 0.98rem; }
  .policy-meta { color: var(--ink-faint); font-size: 0.8rem; margin-top: 3px; }
  .policy-meta-warn { color: var(--amber); font-weight: 600; }
  .status-pill {
    flex-shrink: 0; font-size: 0.78rem; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    white-space: nowrap;
  }
  .status-done { background: var(--positive-soft); color: var(--positive); }
  .status-progress { background: var(--amber-soft); color: var(--amber); }
  .status-pending { background: var(--pending-soft); color: var(--pending); }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: none; border-radius: var(--radius-sm); padding: 12px 22px; font-size: 0.92rem;
    font-weight: 600; cursor: pointer; transition: background var(--transition), opacity var(--transition), transform var(--transition);
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--ink); color: var(--surface); }
  .btn-primary:hover:not(:disabled) { background: var(--accent-ink); }
  .btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
  .btn-outline:hover:not(:disabled) { border-color: var(--ink-faint); }
  .text-btn {
    background: none; border: none; color: var(--ink-soft); cursor: pointer; font-size: 0.88rem;
    padding: 4px 0; margin-bottom: 16px; font-weight: 500;
  }
  .text-btn:hover { color: var(--ink); }

  /* ===== PDF viewer / reading gate ===== */
  .viewer-head h1 { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; margin: 0 0 18px; }
  .progress-bar { height: 4px; background: var(--line-soft); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .progress-bar-fill { height: 100%; width: 0%; background: var(--accent); transition: width 400ms ease; }

  /* Continuous-scroll PDF: all pages stacked in one scrollable panel so
     staff can swipe/scroll through naturally instead of paging. */
  .pdf-scroll {
    position: relative; max-height: 76vh; overflow-y: auto; overflow-x: hidden;
    background: var(--surface); border: 2px solid var(--accent); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm); margin-bottom: 18px; -webkit-overflow-scrolling: touch;
  }
  .pdf-page-counter {
    position: sticky; top: 0; z-index: 2; text-align: center; font-size: 0.8rem; font-weight: 600;
    color: var(--surface); background: var(--accent); padding: 8px 0; letter-spacing: 0.02em;
  }
  .pdf-pages { padding: 22px 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .pdf-page canvas { max-width: 100%; height: auto; border-radius: var(--radius-sm); box-shadow: 0 1px 6px rgba(28, 33, 31, 0.14); display: block; }

  .viewer-controls {
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
  }
  .viewer-controls.single { justify-content: center; }
  .viewer-hint { text-align: center; color: var(--ink-faint); font-size: 0.84rem; margin-top: 14px; }
  .viewer-error { color: var(--ink-soft); padding: 40px 20px; text-align: center; }

  /* ===== Key points ===== */
  .key-points { max-width: 560px; margin: 0 auto 28px; padding: 0 0 0 20px; }
  .key-points li { margin-bottom: 12px; font-size: 0.98rem; }

  /* ===== Quiz ===== */
  .quiz-wrap { max-width: 640px; margin: 0 auto; }
  .quiz-wrap .progress-bar { margin-bottom: 26px; }
  .quiz-question {
    font-family: var(--font-display); font-size: 1.65rem; font-weight: 600; line-height: 1.35;
    margin: 8px 0 30px;
  }
  .quiz-options { display: flex; flex-direction: column; gap: 14px; }
  .quiz-option {
    text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 20px 24px; font-size: 1.08rem; line-height: 1.4; cursor: pointer;
    transition: border-color var(--transition), background var(--transition);
  }
  .quiz-option:hover { border-color: var(--accent); background: var(--accent-soft); }

  .result-card { max-width: 480px; margin: 40px auto 0; text-align: center; }
  .result-card h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 6px 0 10px; }
  .result-card p { color: var(--ink-soft); margin: 0 0 24px; }
  .result-pass h1 { color: var(--positive); }

  /* ===== Admin dashboard ===== */
  .summary-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  @media (max-width: 640px) { .summary-cards { grid-template-columns: repeat(2, 1fr); } }
  .summary-card {
    background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
    padding: 18px; text-align: left; border-top: 3px solid var(--accent);
  }
  .summary-value { font-family: var(--font-display); font-size: 1.8rem; font-weight: 600; color: var(--accent-ink); }
  .summary-label { color: var(--ink-faint); font-size: 0.8rem; margin-top: 4px; }
  .admin-table-head { margin-bottom: 14px; }
  .filter-input {
    width: 100%; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: var(--radius-sm);
    font-size: 0.9rem; background: var(--surface);
  }
  .filter-input:focus { outline: none; border-color: var(--accent); }
  .table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .admin-table th {
    text-align: left; padding: 12px 16px; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink-faint); border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap;
  }
  .admin-table td { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
  .admin-table tr:last-child td { border-bottom: none; }
  .cell-sub { color: var(--ink-faint); font-size: 0.78rem; margin-top: 2px; }
  .outstanding-cell { color: var(--ink-soft); max-width: 320px; }
  .all-done { color: var(--positive); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: var(--surface); padding: 11px 22px; border-radius: var(--radius-sm);
    font-size: 0.86rem; font-weight: 500; opacity: 0; transition: transform 260ms ease, opacity 260ms ease;
    z-index: 999; pointer-events: none; max-width: 90vw; text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  [hidden] { display: none !important; }

  @media (max-width: 520px) {
    .app-shell { padding: 0 14px 64px; }
    .pdf-scroll { max-height: 70vh; }
    .quiz-question { font-size: 1.35rem; }
  }
</style>
