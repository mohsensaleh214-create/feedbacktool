name: Build Misk Scribe (Mac app)

on:
  push:
    paths:
      - "MiskScribe/**"
      - ".github/workflows/build-misk-scribe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: MiskScribe
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload the app (download it from this run's Summary page)
        uses: actions/upload-artifact@v4
        with:
          name: Misk-Scribe
          path: MiskScribe/build/Misk-Scribe.zip
          if-no-files-found: error

      - name: Publish as the "latest build" on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete murmur-latest --cleanup-tag --yes || true  # old placeholder name
          gh release delete misk-scribe-latest --cleanup-tag --yes || true
          gh release create misk-scribe-latest build/Misk-Scribe.zip \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Misk Scribe — latest build" \
            --notes "Built from \`${GITHUB_REF_NAME}\` (build ${{ github.run_number }}). Download **Misk-Scribe.zip** below, then follow the install steps in MiskScribe/README.md."
